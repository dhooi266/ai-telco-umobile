<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Plus Jakarta Sans",sans-serif;color:#fff;position:relative;background:#121214}
.bg{position:absolute;inset:0 0 0 360px;background:url(assets/hero-leaders.jpg) center 30%/cover no-repeat}
.fade{position:absolute;inset:0;background:
  linear-gradient(90deg,#121214 0%,#121214 31%,rgba(18,18,20,.93) 42%,rgba(18,18,20,.55) 58%,rgba(18,18,20,.05) 78%),
  linear-gradient(0deg,rgba(10,10,12,.75) 0%,rgba(10,10,12,0) 32%)}
.glow{position:absolute;left:-120px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(255,121,0,.28),transparent 65%)}
.top{position:absolute;left:52px;top:42px;display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:14px;padding:8px 14px;display:flex}
.logo img{height:44px;display:block}
.pill{background:#ff7900;color:#fff;font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(255,121,0,.4)}
.pill.ghost{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);box-shadow:none}
.txt{position:absolute;left:52px;top:135px;width:640px}
h1{font-weight:800;letter-spacing:-.03em;line-height:1}
h1 .a{display:block;font-size:46px}
h1 .b{display:block;font-size:74px;color:#ffa24d;margin-top:6px;text-shadow:0 6px 30px rgba(255,121,0,.35)}
.sub{font-size:28px;font-weight:700;color:rgba(255,255,255,.88);margin-top:10px}
.chips{position:absolute;left:52px;top:452px;display:flex;gap:10px}
.chip{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);border-radius:14px;padding:10px 14px;font-weight:700;font-size:18px;backdrop-filter:blur(4px)}
.chip svg{width:22px;height:22px;color:#ffa24d;flex:none}
.foot{position:absolute;left:52px;bottom:40px;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:600;color:rgba(255,255,255,.85)}
.foot b{color:#fff;font-size:24px;font-weight:800}
.foot i{width:6px;height:6px;border-radius:50%;background:#ff7900}
.trainer{position:absolute;right:40px;bottom:36px;background:#fff;color:#1a1a1a;border-radius:18px;padding:12px 22px 12px 12px;display:flex;gap:14px;align-items:center;box-shadow:0 16px 36px rgba(0,0,0,.4)}
.trainer img{width:66px;height:66px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #ff7900}
.trainer small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#d96600;text-transform:uppercase}
.trainer b{display:block;font-size:23px;line-height:1.2}
.trainer span{display:block;font-size:14px;color:#625d58;font-weight:600}
.logo{align-items:center;gap:10px}.logo .x{color:#888;font-size:22px}</style></head><body>
<div class="bg"></div><div class="fade"></div><div class="glow"></div>
<div class="top">
  <div class="logo"><img src="assets/dac-logo.png"><span class="x">×</span><img src="assets/umobile-logo.svg"></div>
  <div class="pill">Prepared for U Mobile</div>
  <div class="pill ghost">Hands-On</div>
</div>
<div class="txt">
  <h1><span class="a">AI Mastery for</span><span class="b">U Mobile Teams</span></h1>
  <div class="sub">Managers &amp; Leaders · Sales &amp; Operations</div>
</div>
<div class="chips">
<div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg> Board Packs</div><div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg>AI Assistants</div><div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg> Dashboards</div><div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg> AI Roadmap</div>
</div>
<div class="foot"><b>6,000+</b> professionals trained <i></i> <b>HRD Corp</b> claimable</div>
<div class="trainer"><img src="assets/david-hooi.jpg"><div><small>Your Trainer</small><b>David Hooi</b><span>HRD Corp Accredited Trainer</span></div></div>
</body></html>
